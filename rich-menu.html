<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KDY Office Rich Menu</title>
    <style>
      :root {
        --ink: #1f2d35;
        --muted: #66767d;
        --line: #d6e1df;
        --paper: #f7faf9;
        --teal: #365f68;
        --teal-soft: #e8f1f0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 2500px;
        height: 843px;
        margin: 0;
        overflow: hidden;
        background: #fff;
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "YuGothic", "Noto Sans JP", sans-serif;
      }

      .menu {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        width: 2500px;
        height: 843px;
        padding: 58px;
        gap: 28px;
        background:
          linear-gradient(135deg, rgba(232, 241, 240, .95), rgba(255, 255, 255, .98) 48%, rgba(246, 250, 249, 1)),
          #fff;
      }

      .item {
        position: relative;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: 56px;
        border: 3px solid var(--line);
        border-radius: 34px;
        background: rgba(255, 255, 255, .82);
      }

      .item::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 18% 12%, rgba(79, 143, 139, .16), transparent 35%),
          linear-gradient(135deg, rgba(255, 255, 255, .78), rgba(247, 250, 249, .7));
        pointer-events: none;
      }

      .item.primary {
        color: #fff;
        border-color: var(--teal);
        background: var(--teal);
      }

      .item.primary::before {
        background:
          radial-gradient(circle at 80% 16%, rgba(255, 255, 255, .2), transparent 34%),
          linear-gradient(135deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, 0));
      }

      .content {
        position: relative;
        display: grid;
        gap: 18px;
        justify-items: center;
        text-align: center;
      }

      .eyebrow {
        color: var(--teal);
        font-size: 34px;
        font-weight: 900;
        letter-spacing: .08em;
      }

      .primary .eyebrow,
      .primary .sub {
        color: rgba(255, 255, 255, .82);
      }

      .title {
        margin: 0;
        font-size: 86px;
        font-weight: 900;
        line-height: 1.05;
        letter-spacing: 0;
      }

      .sub {
        margin: 0;
        color: var(--muted);
        font-size: 32px;
        font-weight: 800;
        line-height: 1.35;
      }

      .icon {
        display: grid;
        place-items: center;
        width: 112px;
        height: 112px;
        margin-bottom: 8px;
        border: 3px solid currentColor;
        border-radius: 28px;
        color: var(--teal);
        font-size: 48px;
        font-weight: 900;
      }

      .primary .icon {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main class="menu" aria-label="KDY Office リッチメニュー">
      <section class="item">
        <div class="content">
          <div class="icon">HP</div>
          <div class="eyebrow">SAMPLE</div>
          <h1 class="title">サンプル<br>を見る</h1>
          <p class="sub">見本サイトを確認</p>
        </div>
      </section>

      <section class="item primary">
        <div class="content">
          <div class="icon">¥</div>
          <div class="eyebrow">PRICE</div>
          <h1 class="title">料金<br>を見る</h1>
          <p class="sub">目安プランを確認</p>
        </div>
      </section>

      <section class="item">
        <div class="content">
          <div class="icon">?</div>
          <div class="eyebrow">CONTACT</div>
          <h1 class="title">相談<br>する</h1>
          <p class="sub">このまま送信</p>
        </div>
      </section>
    </main>
  </body>
</html>
